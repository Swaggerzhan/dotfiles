# ====== windows and layout ======
tab_title_template "[{index}]: {title}"
tab_bar_edge top
# tab_bar_margin_width 10
tab_title_max_length 24
tab_bar_style powerline
tab_powerline_style slanted

hide_window_decorations titlebar-only
window_padding_width 4
background_opacity 0.85
background_blur 1
remenber_window_size yes


# ====== keyboard and screen latency ======
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no
cursor_trail 3
cursor_trail_decay 0.1 0.4
# font_family      monaco
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size 15.0

# ===== Mappings =====
# open new split (window) with cmd+d retaining the cwd
map cmd+w close_window
map cmd+q quit
#map cmd+shif+n new_os_window
#map cmd+d launch --location=hsplit --cwd=current
#map cmd+shift+d launch --location=vsplit --cwd=current

# open new tab with cmd+t
map cmd+t new_tab

# switch between next and previous splits
#map cmd+]        next_window
#map cmd+[        previous_window

# clear the terminal screen
map cmd+k combine : clear_terminal scrollback active : send_text normal,application \x0c

# jump to beginning and end of word
map cmd+left send_text all \x1b\x62
map cmd+right send_text all \x1b\x66

# jump to beginning and end of line
# map cmd+left send_text all \x01
# map cmd+right send_text all \x05

# Map cmd + <num> to corresponding tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# changing font sizes
map cmd+equal    change_font_size all +2.0
map cmd+minus    change_font_size all -2.0
#map cmd+0        change_font_size all 0

map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard
copy_on_select yes


# BEGIN_KITTY_FONTS
font_family      family="Monaco"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

enable_audio_bell no
allow_remote_control yes
